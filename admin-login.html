<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ImARs · Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/floating-cubes.css" />
  <link rel="stylesheet" href="css/experience.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="login-page login-scene admin-login-scene">
  <div class="login-cubes" aria-hidden="true"><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span></div>
  <header class="experience-header">
    <a class="experience-brand" href="login.html" aria-label="ImARs login"><img src="assets/imars-logo.png" alt="" width="48" height="48" /><span>ImARs<small>SCIENCE IN A NEW DIMENSION</small></span></a>
    <div class="experience-actions topbar-right" aria-label="Display settings"></div>
  </header>
  <div class="signin-layout">
  <main class="login-card w-full max-w-[440px] bg-white rounded-3xl p-8">
    <div class="flex items-center gap-3 mb-6">
      <img class="brand-mark login-brand-mark" src="assets/imars-logo.png" alt="ImARs logo" />
      <div>
        <strong class="block text-lg font-extrabold">ImARs</strong>
        <small class="block mt-0.5 text-indigo-400 text-[13px] font-semibold">Administrator Portal</small>
      </div>
    </div>

    <h1 class="text-[28px] tracking-tight font-extrabold mb-1.5">Welcome back</h1>
    <p class="text-slate-500 text-[15px] mb-6">Sign in to manage your school and teacher accounts.</p>
    
    <form id="adminLoginForm" autocomplete="on">
      <div class="mb-3.5">
        <label for="adminIdentifier" class="block text-[13px] font-bold text-slate-400 mb-2">Admin Email or ID</label>
        <div class="login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 5 10 8L22 5"/></svg><input autocomplete="username" id="adminIdentifier" name="adminIdentifier" type="text" placeholder="Enter admin email or ID" required
          class="w-full border border-periwinkle bg-mist rounded-[14px] py-3 px-3.5 text-[15px] text-slate-900 outline-none focus:border-steel focus:bg-white focus:ring-4 focus:ring-steel/25" /></div>
      </div>
      <div class="mb-4">
        <label for="adminPassword" class="block text-[13px] font-bold text-slate-400 mb-2">Password</label>
        <div class="relative login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
          <input autocomplete="current-password" id="adminPassword" name="adminPassword" type="password" placeholder="Enter admin password" required
            class="w-full border border-periwinkle bg-mist rounded-[14px] py-3 px-3.5 pr-12 text-[15px] text-slate-900 outline-none focus:border-steel focus:bg-white focus:ring-4 focus:ring-steel/25" />
          <button id="toggleAdminPassword" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-lg text-slate-400 hover:bg-slate-800" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="admin-eye-open" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="admin-eye-off hidden" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>
          </button>
        </div>
      </div>

      <p class="hidden text-red-400 text-[13px] font-semibold mb-3" role="alert" id="adminError"></p>
      
      <button type="submit" id="adminSubmitBtn" aria-busy="false"
        class="login-submit w-full rounded-full py-3.5 px-4 bg-indigo-600 text-white font-extrabold text-[15px] shadow-[0_8px_18px_rgba(79,70,229,0.35)] hover:bg-indigo-700 cursor-pointer">
        <span class="login-submit-spinner" aria-hidden="true"></span>
        <span data-login-label>Sign in as Admin</span>
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="login.html" class="signin-admin">← Return to Teacher Login</a>
    </div>
  </main>
    <figure class="signin-model-scene">
      <figcaption><small class="scene-eyebrow">SCIENCE, IN MOTION</small>See science <span>come to life.</span></figcaption>
      <div class="signin-model-stage" aria-hidden="true" inert>
        <model-viewer class="showcase-model is-current" data-model="heart" src="assets/showcase/heart.glb" alt="" auto-rotate rotation-per-second="12deg" auto-rotate-delay="0" camera-orbit="0deg 80deg 100%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="earth" src="assets/showcase/earth.glb" alt="" auto-rotate rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="20deg 60deg 105%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="volcano" src="assets/showcase/volcano.glb" alt="" auto-rotate rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="30deg 65deg 105%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="orion" src="assets/showcase/orion.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="0deg 75deg 110%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="snowflake" src="assets/showcase/snowflake.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="0deg 75deg 105%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="pulley" src="assets/showcase/pulley.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="15deg 75deg 105%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="water-cycle" src="assets/showcase/water-cycle.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="25deg 65deg 110%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="magnet" src="assets/showcase/magnet.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="20deg 70deg 110%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="waves" src="assets/showcase/waves.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="0deg 65deg 110%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
        <model-viewer class="showcase-model" data-model="melting-ice" src="assets/showcase/melting-ice.glb" alt="" rotation-per-second="10deg" auto-rotate-delay="0" camera-orbit="15deg 70deg 105%" field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager" reveal="auto" tabindex="-1" inert><span slot="progress-bar"></span></model-viewer>
      </div>
    </figure>
  </div>

  <script type="module" src="js/admin-login.js"></script>
  <script type="module" src="js/vendor/model-viewer.js"></script>
  <script type="module" src="js/showcase.js"></script>
</body>
</html>
