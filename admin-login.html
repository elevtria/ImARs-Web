<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ImARs · Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="login-page min-h-screen bg-slate-950 text-slate-100 font-sans grid place-items-center p-6">
  <div class="login-cubes" aria-hidden="true"><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span></div>
  <main class="login-card w-full max-w-[440px] bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8">
    <div class="flex items-center gap-3 mb-6">
      <img class="brand-mark login-brand-mark" src="assets/imars-logo.png" alt="ImARs logo" />
      <div>
        <strong class="block text-lg font-extrabold text-white">ImARs</strong>
        <small class="block mt-0.5 text-indigo-400 text-[13px] font-semibold">Administrator Portal</small>
      </div>
    </div>

    <h1 class="text-[28px] tracking-tight font-extrabold mb-1.5 text-white">Admin Access</h1>
    <p class="text-slate-400 text-[15px] mb-6">Restricted system administration gateway.</p>
    
    <form id="adminLoginForm" autocomplete="on">
      <div class="mb-3.5">
        <label for="adminIdentifier" class="block text-[13px] font-bold text-slate-400 mb-2">Admin Email or ID</label>
        <div class="login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 5 10 8L22 5"/></svg><input autocomplete="username" id="adminIdentifier" name="adminIdentifier" type="text" placeholder="Enter admin credentials" required
          class="w-full border border-slate-700 bg-slate-800 rounded-[14px] py-3 px-3.5 text-[15px] text-white outline-none focus:border-indigo-500 focus:bg-slate-900 focus:ring-4 focus:ring-indigo-500/25" /></div>
      </div>
      <div class="mb-4">
        <label for="adminPassword" class="block text-[13px] font-bold text-slate-400 mb-2">Password</label>
        <div class="relative login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
          <input autocomplete="current-password" id="adminPassword" name="adminPassword" type="password" placeholder="Enter admin password" required
            class="w-full border border-slate-700 bg-slate-800 rounded-[14px] py-3 px-3.5 pr-12 text-[15px] text-white outline-none focus:border-indigo-500 focus:bg-slate-900 focus:ring-4 focus:ring-indigo-500/25" />
          <button id="toggleAdminPassword" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-lg text-slate-400 hover:bg-slate-800" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="admin-eye-open" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="admin-eye-off hidden" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>
          </button>
        </div>
      </div>

      <p class="hidden text-red-400 text-[13px] font-semibold mb-3" role="alert" id="adminError"></p>
      
      <button type="submit" id="adminSubmitBtn" aria-busy="false"
        class="login-submit w-full rounded-full py-3.5 px-4 bg-indigo-600 text-white font-extrabold text-[15px] shadow-[0_8px_18px_rgba(79,70,229,0.35)] hover:bg-indigo-700 cursor-pointer">
        <span class="login-submit-spinner" aria-hidden="true"></span>
        <span data-login-label>Sign in as Admin</span>
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="login.html" class="text-xs text-slate-500 hover:text-slate-300 transition">← Return to Teacher Login</a>
    </div>
  </main>

  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
