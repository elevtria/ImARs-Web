<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImARs · Teacher Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-page min-h-screen bg-mist text-slate-900 font-sans grid place-items-center p-6">
  <main class="login-card w-full max-w-[440px] bg-white rounded-3xl shadow-[0_8px_24px_rgba(28,20,60,0.05)] p-8">
    <div class="flex items-center justify-between gap-3 mb-6">
      <div class="flex items-center gap-3">
        <img class="brand-mark login-brand-mark" src="assets/imars-logo.png" alt="ImARs logo" />
        <div>
          <strong class="block text-lg font-extrabold">ImARs</strong>
          <small class="block mt-0.5 text-slate-400 text-[13px]">Teacher Portal</small>
        </div>
      </div>
      <button id="openAdminModalBtn" type="button"
        class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-full transition cursor-pointer">
        <svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v3z"/></svg> Admin Login
      </button>
    </div>

    <h1 class="text-[28px] tracking-tight font-extrabold mb-1.5">Welcome back</h1>
    <p class="text-slate-500 text-[15px] mb-6">Log in to continue to your class dashboard.</p>
    
    <form id="loginForm">
      <div class="mb-3.5">
        <label for="teacherId" class="block text-[13px] font-bold text-slate-500 mb-2">Teacher ID</label>
        <div class="login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v3z"/></svg><input id="teacherId" name="teacherId" type="text" autocomplete="username" placeholder="Enter Teacher ID" required
          class="w-full border border-periwinkle bg-mist rounded-[14px] py-3 px-3.5 text-[15px] text-slate-900 outline-none focus:border-steel focus:bg-white focus:ring-4 focus:ring-steel/25" /></div>
      </div>
      <div class="mb-3.5">
        <label for="password" class="block text-[13px] font-bold text-slate-500 mb-2">Password</label>
        <div class="relative login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required
            class="w-full border border-periwinkle bg-mist rounded-[14px] py-3 px-3.5 pr-12 text-[15px] text-slate-900 outline-none focus:border-steel focus:bg-white focus:ring-4 focus:ring-steel/25" />
          <button id="togglePassword" type="button" aria-label="Show password"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-lg text-steel hover:bg-periwinkle/60">
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="eyeOff" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>
      <p class="hidden text-red-600 text-[13px] font-semibold mb-3" role="alert" id="error">Please enter your ID and password.</p>
      <button id="teacherSubmitBtn" class="login-submit w-full border-0 rounded-full py-3.5 px-4 bg-gold text-slate-900 font-extrabold text-[15px] cursor-pointer shadow-[0_8px_18px_rgba(254,183,5,0.35)] hover:bg-[#e5a404]" type="submit" aria-busy="false">
        <span class="login-submit-spinner" aria-hidden="true"></span>
        <span data-login-label>Log in</span><svg class="button-arrow" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </button>
    </form>

    <p class="mt-4 text-center text-slate-400 text-[13px]">Access Grade 6 Pintong Gubat</p>
    <span class="mt-4 block w-full text-center text-steel font-bold text-[13px]" data-school-year>SY 2026–27</span>
  </main>

  <dialog aria-labelledby="adminModalTitle" aria-describedby="adminModalDescription" id="adminLoginModal" class="fixed inset-0 m-auto border-0 rounded-3xl p-0 w-[calc(100%-2rem)] max-w-[400px] bg-white shadow-2xl backdrop:bg-slate-900/50 backdrop:backdrop-blur-sm">
    <div class="p-7">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 id="adminModalTitle" class="text-xl font-extrabold text-slate-900">Admin Portal</h2>
          <p id="adminModalDescription" class="text-xs text-slate-400 mt-0.5">Sign in with your administrator credentials.</p>
        </div>
        <button id="closeAdminModalBtn" type="button" aria-label="Close modal"
          class="w-8 h-8 rounded-full grid place-items-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 text-lg font-bold cursor-pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>

      <form id="adminLoginForm">
        <div class="mb-3.5">
          <label for="adminIdentifier" class="block text-[13px] font-bold text-slate-500 mb-1.5">Admin Email or ID</label>
          <div class="login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 5 10 8L22 5"/></svg><input autocomplete="username" id="adminIdentifier" name="adminIdentifier" type="text" placeholder="admin@school.edu or ADMIN1000" required
            class="w-full border border-periwinkle bg-mist rounded-[14px] py-2.5 px-3.5 text-[14px] text-slate-900 outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/20" /></div>
        </div>
        <div class="mb-4">
          <label for="adminPassword" class="block text-[13px] font-bold text-slate-500 mb-1.5">Password</label>
          <div class="login-field"><svg class="field-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg><input autocomplete="current-password" id="adminPassword" name="adminPassword" type="password" placeholder="Enter admin password" required
            class="w-full border border-periwinkle bg-mist rounded-[14px] py-2.5 px-3.5 text-[14px] text-slate-900 outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/20" /><button id="toggleAdminPassword" class="admin-password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="admin-eye-open" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="admin-eye-off" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg></button></div>
        </div>

        <p class="hidden text-red-600 text-[12px] font-semibold mb-3" role="alert" id="adminError"></p>

        <div class="flex gap-2.5 pt-1">
          <button id="cancelAdminModalBtn" type="button"
            class="w-1/3 rounded-full py-2.5 px-4 border border-slate-200 text-slate-600 font-bold text-[14px] hover:bg-slate-50 cursor-pointer">
            Cancel
          </button>
          <button type="submit" id="adminSubmitBtn" aria-busy="false"
            class="login-submit w-2/3 rounded-full py-2.5 px-4 bg-indigo-600 text-white font-extrabold text-[14px] shadow-[0_8px_18px_rgba(79,70,229,0.3)] hover:bg-indigo-700 cursor-pointer">
            <span class="login-submit-spinner" aria-hidden="true"></span>
            <span data-login-label>Sign in as Admin</span><svg class="button-arrow" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/school-year.js"></script>
</body>
</html>
