<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>ImARs · Manage Teachers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/admin-dashboard.css" />
  <link rel="stylesheet" href="css/manage-teachers.css" />
  <link rel="stylesheet" href="css/loading.css" />
  <link rel="stylesheet" href="css/portal-design.css" />
  <link rel="stylesheet" href="css/floating-cubes.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="admin-portal" data-auth-pending>
  <div class="login-cubes" aria-hidden="true"><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span><span class="floating-cube"><i></i><i></i><i></i></span></div>
  <div class="app">
  <header class="admin-topbar topbar">
    <div class="admin-topbar-inner">
      <div class="admin-topbar-left">
        <button class="menu-button" id="menuBtn" type="button" aria-label="Open admin navigation" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <span class="current-page">Manage Teachers</span>
      </div>
      <div class="admin-topbar-right">
        <button class="menu-button admin-notification" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5"/><path d="M9.5 17a2.5 2.5 0 0 0 5 0"/></svg>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
        <div class="school-year-control">
          <label for="schoolYearSelect">School year for all teachers</label>
          <select class="admin-year" id="schoolYearSelect" aria-describedby="schoolYearStatus" disabled><option value="2026">SY 2026–27</option></select>
          <span class="school-year-status" id="schoolYearStatus" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="dashboard-content manage-content" inert data-auth-shell>
    <section class="manage-heading" data-auth-shell>
      <div>
        <h1 data-auth-shell>Manage Teachers</h1>
        <p id="teacherSummary">3 active · 4 total</p>
      </div>
      <div class="manage-tools">
        <label class="teacher-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="teacherSearch" type="search" placeholder="Search teacher..." aria-label="Search teachers" />
        </label>
        <button class="add-teacher-button" id="addTeacherButton" type="button">
          <span aria-hidden="true">+</span> Add Teacher
        </button>
      </div>
    </section>

    <section class="teacher-metrics" aria-label="Teacher and class totals" data-auth-shell data-await-content="admin-report">
      <article class="teacher-metric" data-auth-shell><span class="metric-accent active-accent"></span><div><small>Active</small><strong id="activeCount">3</strong></div></article>
      <article class="teacher-metric" data-auth-shell><span class="metric-accent inactive-accent"></span><div><small>Inactive</small><strong id="inactiveCount">1</strong></div></article>
      <article class="teacher-metric" data-auth-shell><span class="metric-accent sections-accent"></span><div><small>Total Sections</small><strong id="sectionCount">6</strong></div></article>
      <article class="teacher-metric" data-auth-shell><span class="metric-accent students-accent"></span><div><small>Total Students</small><strong id="studentCount">155</strong></div></article>
    </section>

    <section class="teacher-list" id="teacherList" aria-label="Teacher accounts" data-loading-path="users classes" data-loading-label="Loading teacher records…" data-auth-shell data-await-content="admin-report"></section>
    <p class="no-teachers" id="noTeachers" hidden>No teachers match your search.</p>
  </main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel" role="navigation" aria-label="Admin portal">
      <a class="brand" href="admin-dashboard.html" aria-label="Admin dashboard">
        <img class="brand-mark" src="assets/imars-logo.png" alt="" />
        <div><strong>ImARs</strong><small>School Admin</small></div>
      </a>
      <nav class="side-nav">
        <a class="nav-item" href="admin-dashboard.html"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>Overview</a>
        <a class="nav-item active" href="manage-teachers.html" aria-current="page"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M4 19a5 5 0 0 1 10 0M17 11v6m-3-3h6"/></svg>Manage Teachers</a>
        <a class="nav-item" href="school-analytics.html"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m6 7H2"/></svg>School Analytics</a>
      </nav>
      <div class="side-user">
        <div class="user-avatar">A</div>
        <div class="user-meta"><strong>Admin</strong><small>School Administrator</small></div>
        <div class="account">
          <button class="user-more" id="accountBtn" type="button" aria-label="Account options" aria-expanded="false" aria-controls="accountMenu">⋮</button>
          <div class="account-menu" id="accountMenu" hidden><a href="admin-login.html">Log out</a></div>
        </div>
      </div>
    </div>
  </aside>

  <dialog class="teacher-dialog" id="teacherDialog" aria-labelledby="dialogTitle">
    <form id="teacherForm" method="dialog">
      <div class="dialog-heading">
        <div><h2 id="dialogTitle">Add Teacher</h2><p>Add a teacher account.</p></div>
        <button class="dialog-close" id="closeTeacherDialog" type="button" aria-label="Close">×</button>
      </div>
      <label>Teacher name<input name="name" required placeholder="e.g. Alex Reyes" /></label>
      <label>Email address<input name="email" type="email" required placeholder="name@school.edu" /></label>
      <label>Subject<input name="subject" required placeholder="e.g. Science" /></label>
      <label>Sections <small>Separate section names with commas.</small><input name="sections" placeholder="Grade 8 – Malinao, Grade 8 – Sampaguita" /></label>
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelTeacherDialog" type="button">Cancel</button>
        <button class="add-teacher-button" type="submit">Add Teacher</button>
      </div>
    </form>
  </dialog>

  <button class="help-button" type="button" aria-label="Help">?</button>
  <script type="module" src="js/manage-teachers.js"></script>
  <script type="module" src="js/teacher-nav.js"></script>
  <script type="module" src="js/navigation-menu.js"></script>
  <script type="module" src="js/school-year.js"></script>
</body>
</html>
